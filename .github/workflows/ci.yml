name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate records and build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Validate every incident against the schema
        run: python scripts/validate.py

      - name: Run tests
        run: python -m pytest -q

      - name: Check that data/incidents.csv matches the JSON records
        run: |
          python scripts/export_csv.py --out /tmp/incidents.csv
          diff -u data/incidents.csv /tmp/incidents.csv

      - name: Build the site
        run: python scripts/build_site.py

      - name: Check that the committed site and docs are up to date
        run: git diff --exit-code -- site docs/stats.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 7
