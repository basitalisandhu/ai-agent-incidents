name: Source links

# Weekly check that every source URL in incidents/ still resolves. Fails only when a URL is
# dead (404, 410 or an unknown host); bot walls (403, 429) are reported but do not fail.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check every source URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Request every source and look up archived copies for any that fail
        run: python scripts/check_sources.py --wayback
